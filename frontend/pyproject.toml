[project]
name = "Frontend thematic portfolio optimizer"
versions = "0.0.1"
description = "Frontend thematic portfolio optimizer"
readme = "../README.md"
requires-python = ">=3.14"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I"
]
ignore = ["SIM108"]

[tool.ruff]
line-length = 96

[tool.mypy]
strict = false
ignore_missing_imports = true